name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm test
      - run: rm -f ./*.tgz
      - run: npm pack
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-remote-deck-*.tgz
          generate_release_notes: true
          draft: false
